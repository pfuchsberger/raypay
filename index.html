<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f0eff4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RayPay">
  <meta name="description" content="RayPay: rayo y trueno sobre una captura de Apple Wallet.">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>RayPay</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width:100%;height:100%;margin:0;overflow:hidden;background:#f0eff4; }
    body { touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer; }
    /* Captura original facilitada por el usuario, sin recrear ni modificar la tarjeta. */
    #walletBackground {
      position:fixed;inset:0;z-index:0;display:block;
      width:100%;height:100%;
      object-fit:cover;object-position:center top;
      pointer-events:none;-webkit-user-drag:none;
    }
    #flash {
      position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;
      mix-blend-mode:screen;
      background:radial-gradient(ellipse at 52% 41%,
        rgba(255,255,232,1) 0%,rgba(255,242,123,.85) 14%,
        rgba(255,220,22,.35) 37%,transparent 76%);
    }
    #fx {
      position:fixed;inset:0;z-index:2;display:block;
      width:100%;height:100%;pointer-events:none;
    }
    @media (prefers-reduced-motion:reduce) {
      /* El efecto se mantiene porque es la función explícita de RayPay. */
    }
  </style>
</head>
<body aria-label="RayPay. Toca cualquier parte de la pantalla para lanzar un rayo con sonido.">
  <img id="walletBackground" src="wallet-background.png" alt="" aria-hidden="true" draggable="false">
  <div id="flash" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <audio id="thunder" preload="auto" playsinline src="thunder.wav"></audio>
  <script src="app.js?v=4" defer></script>
</body>
</html>
